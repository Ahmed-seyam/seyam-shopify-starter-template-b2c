services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    # Put a reverse proxy (Caddy/nginx) in front for TLS in production.

  # Optional: shared cache for multi-instance deployments. Single-instance
  # setups don't need this — Next.js file/memory cache works out of the box.
